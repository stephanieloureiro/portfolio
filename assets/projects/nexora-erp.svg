<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Nexora ERP project preview</title>
  <desc id="desc">Stylized dashboard interface with ERP metrics, tables, and navigation panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="0" fill="url(#bg)"/>
  <g opacity=".18">
